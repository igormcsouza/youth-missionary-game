name: Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      id: setup-python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v3
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: poetry install --no-interaction

    - name: Install pre-commit hooks
      run: poetry run pre-commit install

    - name: Run pre-commit on changed files
      run: |
        set +e  # Don't exit on error, so we can fallback
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          # For pull requests, compare against the base branch
          echo "Running pre-commit on changed files (PR mode)..."
          poetry run pre-commit run --from-ref origin/${{ github.base_ref }} --to-ref HEAD
          EXIT_CODE=$?
        else
          # For push events, compare against the previous commit
          echo "Running pre-commit on changed files (push mode)..."
          poetry run pre-commit run --from-ref HEAD~1 --to-ref HEAD
          EXIT_CODE=$?
        fi
        
        # If changed files approach failed, fallback to all files
        if [ $EXIT_CODE -ne 0 ]; then
          echo "Changed files approach failed, falling back to --all-files..."
          poetry run pre-commit run --all-files
        fi
      env:
        SKIP: pytest

    - name: Run tests with coverage
      env:
        AUTH: test_password_for_ci
      run: |
        poetry run pytest tests/ --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=85 -v

    - name: Test Docker build
      run: |
        docker build --build-arg PIP_TRUSTED_HOST=1 -t youth-missionary-game:ci-test .
        echo "✅ Docker build successful"

    - name: Upload coverage to Codecov
      id: codecov
      if: success()
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
        verbose: true
      continue-on-error: true
